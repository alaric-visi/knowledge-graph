<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 280" width="1080" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="pipeBg" x1="0" y1="0" x2="1080" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <marker id="pipeArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8" />
    </marker>
  </defs>

  <rect width="1080" height="280" rx="16" fill="url(#pipeBg)" stroke="#334155" stroke-width="1.5" />
  <text x="540" y="36" text-anchor="middle" fill="#F8FAFC" font-size="18" font-weight="700">In-Process Local Embedding Pipeline (src/local-embed.ts)</text>
  <text x="540" y="58" text-anchor="middle" fill="#94A3B8" font-size="12">Zero-dependency TypeScript pipeline calibrated to the [0.38, 1.0] cosine similarity range of bge-large</text>

  <!-- Step 1 -->
  <rect x="24" y="84" width="188" height="132" rx="10" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5" />
  <text x="118" y="110" text-anchor="middle" fill="#C7D2FE" font-size="13" font-weight="700">1. Tokenise &amp; Split</text>
  <text x="118" y="134" text-anchor="middle" fill="#E2E8F0" font-size="11">Strip prefix boilerplate</text>
  <text x="118" y="154" text-anchor="middle" fill="#94A3B8" font-size="11">Split camelCase &amp; paths</text>
  <text x="118" y="174" text-anchor="middle" fill="#A5B4FC" font-size="10" font-family="monospace">refreshToken -&gt;</text>
  <text x="118" y="190" text-anchor="middle" fill="#A5B4FC" font-size="10" font-family="monospace">refresh, token</text>

  <!-- Step 2 -->
  <rect x="238" y="84" width="188" height="132" rx="10" fill="#1E1B4B" stroke="#A78BFA" stroke-width="1.5" />
  <text x="332" y="110" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700">2. Stem &amp; Expand</text>
  <text x="332" y="134" text-anchor="middle" fill="#E2E8F0" font-size="11">Inflection stemmer</text>
  <text x="332" y="154" text-anchor="middle" fill="#94A3B8" font-size="11">Domain synonym map</text>
  <text x="332" y="174" text-anchor="middle" fill="#C4B5FD" font-size="10" font-family="monospace">caching -&gt; cach</text>
  <text x="332" y="190" text-anchor="middle" fill="#C4B5FD" font-size="10" font-family="monospace">jwt -&gt; token, auth</text>

  <!-- Step 3 -->
  <rect x="452" y="84" width="188" height="132" rx="10" fill="#0F2942" stroke="#38BDF8" stroke-width="1.5" />
  <text x="546" y="110" text-anchor="middle" fill="#BAE6FD" font-size="13" font-weight="700">3. Multi-Granular Features</text>
  <text x="546" y="134" text-anchor="middle" fill="#E2E8F0" font-size="11">Sublinear TF unigrams</text>
  <text x="546" y="154" text-anchor="middle" fill="#E2E8F0" font-size="11">Sorted word bigrams</text>
  <text x="546" y="174" text-anchor="middle" fill="#7DD3FC" font-size="11">Character 4-grams</text>
  <text x="546" y="192" text-anchor="middle" fill="#94A3B8" font-size="10">Title &amp; identifier boost</text>

  <!-- Step 4 -->
  <rect x="666" y="84" width="188" height="132" rx="10" fill="#0F2942" stroke="#22D3EE" stroke-width="1.5" />
  <text x="760" y="110" text-anchor="middle" fill="#A5F3FC" font-size="13" font-weight="700">4. Signed Feature Hash</text>
  <text x="760" y="134" text-anchor="middle" fill="#E2E8F0" font-size="11">Dual 32-bit FNV-1a</text>
  <text x="760" y="154" text-anchor="middle" fill="#94A3B8" font-size="11">Projects into 383 buckets</text>
  <text x="760" y="174" text-anchor="middle" fill="#67E8F9" font-size="10" font-family="monospace">h1(f) -&gt; bucket 1..383</text>
  <text x="760" y="190" text-anchor="middle" fill="#67E8F9" font-size="10" font-family="monospace">h2(f) -&gt; sign +1 / -1</text>

  <!-- Step 5 -->
  <rect x="880" y="84" width="176" height="132" rx="10" fill="#0F292A" stroke="#10B981" stroke-width="1.5" />
  <text x="968" y="110" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="700">5. 384-d Unit Vector</text>
  <text x="968" y="134" text-anchor="middle" fill="#E2E8F0" font-size="11">dim[0] = 0.62 baseline</text>
  <text x="968" y="154" text-anchor="middle" fill="#E2E8F0" font-size="11">dim[1..383] L2-scaled</text>
  <text x="968" y="174" text-anchor="middle" fill="#6EE7B7" font-size="10">Unrelated: ~0.38 (&lt; 0.60)</text>
  <text x="968" y="190" text-anchor="middle" fill="#6EE7B7" font-size="10">Relevant: 0.61 to 0.95</text>

  <!-- Connectors -->
  <line x1="212" y1="150" x2="236" y2="150" stroke="#38BDF8" stroke-width="2" marker-end="url(#pipeArrow)" />
  <line x1="426" y1="150" x2="450" y2="150" stroke="#38BDF8" stroke-width="2" marker-end="url(#pipeArrow)" />
  <line x1="640" y1="150" x2="664" y2="150" stroke="#38BDF8" stroke-width="2" marker-end="url(#pipeArrow)" />
  <line x1="854" y1="150" x2="878" y2="150" stroke="#38BDF8" stroke-width="2" marker-end="url(#pipeArrow)" />

  <text x="540" y="252" text-anchor="middle" fill="#CBD5E1" font-size="12">Result: Cold-start embedding takes &lt;5ms in Node with zero native binary dependencies or external network calls</text>
</svg>

